[project]
name = "gemini-client-impl"
version = "0.1.0"
description = "Gemini implementation of ai_client_api AIClient"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["ai-client-api", "google-genai>=1.69.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_client_impl"]

[tool.uv.sources]
ai-client-api = { workspace = true }
