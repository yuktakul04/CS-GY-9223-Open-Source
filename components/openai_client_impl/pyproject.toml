[project]
name = "openai-client-impl"
version = "0.1.0"
description = "OpenAI implementation of ai_client_api AIClient"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["ai-client-api", "openai>=2.32.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openai_client_impl"]

[tool.uv.sources]
ai-client-api = { workspace = true }
