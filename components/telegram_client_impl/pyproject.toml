[project]
name = "telegram-client-impl"
version = "0.1.0"
description = "Telegram implementation for shared chat_client_api"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["chat-client-api", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_client_impl"]

[tool.uv.sources]
chat-client-api = { git = "https://github.com/HarshithKoriRaj/Shared-API.git" }
