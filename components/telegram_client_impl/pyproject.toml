[project]
name = "telegram-client-impl"
version = "0.1.0"
description = "Telegram implementation scaffold for chat_client_api"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["chat-client-api", "telethon"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_client_impl"]
