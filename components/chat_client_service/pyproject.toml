[project]
name = "chat-client-service"
version = "0.1.0"
description = "FastAPI service exposing chat client operations over HTTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "chat-client-api", "telegram-client-impl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_client_service"]
