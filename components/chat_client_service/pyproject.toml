[project]
name = "chat-client-service"
version = "0.1.0"
description = "FastAPI service exposing chat client operations over HTTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "ai-client-api",
    "chat-client-api",
    "httpx>=0.27.0",
    "gemini-client-impl",
    "issue-tracker-integration",
    "issue-tracker-client-impl",
    "openai-client-impl",
    "pydantic>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "slack-client-impl",
    "python-dotenv>=1.1.0",
    "telegram-client-impl",
    "watchtower>=3.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_client_service"]
