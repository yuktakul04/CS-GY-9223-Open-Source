[project]
name = "chat-client-service-api-client"
version = "0.1.0"
description = "Client package for chat_client_service OpenAPI endpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0", "pydantic>=2.8.0", "attrs>=23.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_client_service_api_client", "src/chat_client_service_client"]
