site_name: Chat Client Documentation
site_description: Documentation for the Chat Client project
site_author: Team 4

repo_url: https://github.com/yuktakul04/CS-GY-9223-Open-Source
repo_name: CS-GY-9223-Open-Source

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference: api-reference.md
  - Telegram Implementation: telegram-implementation.md
  - Chat Client Service: chat-client-service.md
  - Service API Client: chat-client-service-api-client.md
  - Service Adapter: chat-client-adapter.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - tables
