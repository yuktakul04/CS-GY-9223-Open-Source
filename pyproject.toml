[project]
name = "chat-client"
version = "0.1.0"
description = "A chat client interface and implementation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [
    {name = "Team 4"}
]
dependencies = [
    "telegram-client-impl",
    "chat-client-api",
    "python-dotenv>=1.1.0",
    "watchtower>=3.3.1",
    "issue-tracker-integration",
    "ospd-issue-tracker-api",
    "openai-client-impl",
    "gemini-client-impl",
    "slack-client-impl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "attrs>=23.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyu_ospsd_chat"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # incompatible with D211 (no-blank-line-before-class); ignoring D203
    "D213",   # incompatible with D212 (multi-line-summary-first-line); ignoring D213
    "S101",   # allow `assert` — used extensively in pytest tests
    "COM812", # trailing comma enforcement conflicts with ruff formatter
    "ISC001", # implicit string concatenation check conflicts with ruff formatter
]

[tool.ruff.lint.isort]
known-first-party = [
    "chat_client_api",
    "telegram_client_impl",
    "nyu_ospsd_chat",
    "chat_client_service",
    "chat_client_service_api_client",
    "chat_client_adapter",
    "issue_tracker_integration",
    "ai_client_api",
    "openai_client_impl",
    "gemini_client_impl",
    "slack_client_impl",
]

[tool.ruff.lint.per-file-ignores]
"components/chat_client_service_api_client/src/chat_client_service_client/**" = ["ALL"]
"**/tests/**" = [
    "INP001",   # test directories intentionally omit __init__.py per assignment
    "ARG002",   # stub/mock implementations of ABCs have unused params by design
    "D103",     # test functions don't require docstrings
    "PLC0415",  # deferred imports inside test functions used for isolation
    "PLR2004",  # allow magic values in test assertions
    "S105",     # "bearer" is OAuth token_type, not a password
    "S106",     # allow fake tokens in test fixtures
    "SLF001",   # allow accessing _client for mocking in tests
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "components/telegram_client_impl/tests",
    "components/chat_client_service/tests",
    "components/chat_client_service_api_client/tests",
    "components/chat_client_adapter/tests",
    "components/issue_tracker_integration/tests",
    "components/ai_client_api/tests",
    "components/openai_client_impl/tests",
    "components/gemini_client_impl/tests",
    "components/slack_client_impl/tests",
]
pythonpath = [
    ".",
    "components/telegram_client_impl/src",
    "components/chat_client_service/src",
    "components/chat_client_service_api_client/src",
    "components/chat_client_adapter/src",
    "components/issue_tracker_integration/src",
    "components/ai_client_api/src",
    "components/openai_client_impl/src",
    "components/gemini_client_impl/src",
    "components/slack_client_impl/src",
]
markers = [
    "e2e: marks end-to-end tests that may require external credentials",
]

[tool.mypy]
python_version = "3.12"
strict = true
# Shared vertical git dependency ships without py.typed (HW3 override).
disable_error_code = ["import-untyped"]

# Untyped shared ``ChatClient`` base from git is treated as ``Any`` under strict mode.
[[tool.mypy.overrides]]
module = [
    "telegram_client_impl.client",
    "slack_client_impl.client",
]
disable_error_code = ["misc"]

# Untyped shared ``chat_client_api`` base classes are treated as ``Any`` under strict mode.
[[tool.mypy.overrides]]
module = [
    "chat_client_adapter.client",
    "chat_client_adapter.models",
]
disable_error_code = ["misc"]

# ospd-issue-tracker-api ships without py.typed; bridge returns are typed via the ABC.
[[tool.mypy.overrides]]
module = "issue_tracker_integration.client"
disable_error_code = ["no-any-return"]

# Team 7 packages ship without py.typed; adapter return types come from our ABCs.
[[tool.mypy.overrides]]
module = [
    "issue_tracker_client_api",
    "issue_tracker_client_api.*",
    "trello_client_impl",
    "trello_client_impl.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "issue_tracker_integration.trello_adapter"
disable_error_code = ["no-any-return", "misc"]

[tool.uv.workspace]
members = [
    "components/telegram_client_impl",
    "components/chat_client_service",
    "components/chat_client_service_api_client",
    "components/chat_client_adapter",
    "components/issue_tracker_integration",
    "components/ai_client_api",
    "components/openai_client_impl",
    "components/gemini_client_impl",
    "components/slack_client_impl",
]

[tool.uv.sources]
chat-client-api = { git = "https://github.com/HarshithKoriRaj/Shared-API.git" }
ospd-issue-tracker-api = { git = "https://github.com/tatyanacthomas/ospd_issue_tracker.git" }
issue-tracker-client-api = { git = "https://github.com/somadisingh/ospsd-team7-issue-tracker.git", subdirectory = "components/issue_tracker_client_api" }
issue-tracker-client-impl = { git = "https://github.com/somadisingh/ospsd-team7-issue-tracker.git", subdirectory = "components/trello_client_impl" }
telegram-client-impl = { workspace = true }
chat-client-service = { workspace = true }
chat-client-service-api-client = { workspace = true }
chat-client-adapter = { workspace = true }
issue-tracker-integration = { workspace = true }
ai-client-api = { workspace = true }
openai-client-impl = { workspace = true }
gemini-client-impl = { workspace = true }
slack-client-impl = { workspace = true }

[tool.coverage.run]
source = ["components"]
branch = true
omit = ["*/tests/*", "*/chat_client_service_client/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
